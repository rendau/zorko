syntax = "proto3";

package zorko_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "/zorko_v1";

service ProjectService {
  rpc List(ProjectListReq) returns (ProjectListRep) {
    option (google.api.http) = {
      get: "/project"
    };
  }

  rpc Get(ProjectGetReq) returns (ProjectMain) {
    option (google.api.http) = {
      get: "/project/{id}"
    };
  }

  // Create возвращает id созданной записи
  rpc Create(ProjectCreateReq) returns (ProjectCreateRep) {
    option (google.api.http) = {
      post: "/project"
      body: "*"
    };
  }

  rpc Update(ProjectUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/project/{id}"
      body: "*"
    };
  }

  // Delete удаляет проект вместе с ключами и проблемами; события в ClickHouse уходят по TTL
  rpc Delete(ProjectGetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/project/{id}"
    };
  }
}

message ProjectMain {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp modified_at = 3;
  int64 org_id = 4;
  string slug = 5;
  string name = 6;
  // платформа по SDK: javascript, vue, react, flutter, react-native…
  string platform = 7;
  // карты с сайта (запасной путь, если из CI карты нет)
  bool site_fetch_enabled = 8;
  // хосты, с которых можно скачивать: admin.mdev.kz; пусто — никуда
  repeated string site_fetch_host = 9;
  string site_fetch_header_name = 10;
  // значение секретного заголовка наружу не отдаётся — только «задано»
  bool site_fetch_header_value_set = 11;
  // как часто проверять адрес заново, минут
  int32 site_fetch_interval_min = 12;
  // запись сессий: off | error | session
  string replay_mode = 13;
  // доля всех сессий 0..1 для примера подключения (replaysSessionSampleRate): решает SDK на сайте
  float replay_session_rate = 14;
  // новых записей в час на копию приёма
  int32 replay_hour_limit = 15;
  // запись сессий доступна (настроен S3)
  bool replay_available = 16;
}

// ProjectHostList — обёртка списка хостов: не передан — список не меняется
message ProjectHostList {
  repeated string values = 1;
}

// List

message ProjectListReq {
  common.ListParamsSt list_params = 1;
  optional int64 org_id = 2;
  optional string slug = 3;
  repeated int64 ids = 4;
}

message ProjectListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated ProjectMain results = 2;
}

// Get (и Delete)

message ProjectGetReq {
  int64 id = 1;
}

// Create

message ProjectCreateReq {
  optional int64 org_id = 1;
  optional string slug = 2;
  optional string name = 3;
  optional string platform = 4;
}

message ProjectCreateRep {
  int64 id = 1;
}

// Update — организация проекта не меняется

message ProjectUpdateReq {
  int64 id = 1;
  optional string slug = 2;
  optional string name = 3;
  optional string platform = 4;
  optional bool site_fetch_enabled = 5;
  ProjectHostList site_fetch_host = 6;
  optional string site_fetch_header_name = 7;
  // пусто или не передано — значение не меняется; стереть — site_fetch_header_clear
  optional string site_fetch_header_value = 8;
  bool site_fetch_header_clear = 9;
  optional int32 site_fetch_interval_min = 10;
  optional string replay_mode = 11;
  optional float replay_session_rate = 12;
  optional int32 replay_hour_limit = 13;
}
