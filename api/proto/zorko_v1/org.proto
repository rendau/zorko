syntax = "proto3";

package zorko_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "/zorko_v1";

service OrgService {
  rpc List(OrgListReq) returns (OrgListRep) {
    option (google.api.http) = {
      get: "/org"
    };
  }

  rpc Get(OrgGetReq) returns (OrgMain) {
    option (google.api.http) = {
      get: "/org/{id}"
    };
  }

  // Create возвращает id созданной записи
  rpc Create(OrgCreateReq) returns (OrgCreateRep) {
    option (google.api.http) = {
      post: "/org"
      body: "*"
    };
  }

  rpc Update(OrgUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/org/{id}"
      body: "*"
    };
  }

  // Delete удаляет организацию вместе с её проектами, ключами и проблемами
  rpc Delete(OrgGetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/org/{id}"
    };
  }
}

message OrgMain {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp modified_at = 3;
  string slug = 4;
  string name = 5;
}

// List

message OrgListReq {
  common.ListParamsSt list_params = 1;
  optional string slug = 2;
  repeated int64 ids = 3;
}

message OrgListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated OrgMain results = 2;
}

// Get (и Delete)

message OrgGetReq {
  int64 id = 1;
}

// Create

message OrgCreateReq {
  optional string slug = 1;
  optional string name = 2;
}

message OrgCreateRep {
  int64 id = 1;
}

// Update

message OrgUpdateReq {
  int64 id = 1;
  optional string slug = 2;
  optional string name = 3;
}
