syntax = "proto3";

package zorko_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "/zorko_v1";

// UsrService — люди и вход (ADR-005, как в kusec)
service UsrService {
  rpc List(UsrListReq) returns (UsrListRep) {
    option (google.api.http) = {
      get: "/usr"
    };
  }

  rpc Get(UsrGetReq) returns (UsrMain) {
    option (google.api.http) = {
      get: "/usr/{id}"
    };
  }

  // Create — админ; без входа — только первый человек (он становится админом). При внешнем входе
  // (AUTH_MODE oidc/proxy) пароль и флаг админа не принимаются, первого человека без входа нет.
  rpc Create(UsrCreateReq) returns (UsrCreateRep) {
    option (google.api.http) = {
      post: "/usr"
      body: "*"
    };
  }

  rpc Update(UsrUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/usr/{id}"
      body: "*"
    };
  }

  rpc Delete(UsrGetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/usr/{id}"
    };
  }

  // Login — пара токенов: access (15 мин) и refresh (30 дней)
  rpc Login(UsrLoginReq) returns (UsrLoginRep) {
    option (google.api.http) = {
      post: "/usr/login"
      body: "*"
    };
  }

  // RefreshToken — новая пара по refresh-токену
  rpc RefreshToken(UsrRefreshTokenReq) returns (UsrLoginRep) {
    option (google.api.http) = {
      post: "/usr/token/refresh"
      body: "*"
    };
  }

  // BootstrapStatus — нужно ли создать первого администратора
  rpc BootstrapStatus(google.protobuf.Empty) returns (UsrBootstrapStatusRep) {
    option (google.api.http) = {
      get: "/usr/bootstrap/status"
    };
  }

  rpc GetProfile(google.protobuf.Empty) returns (UsrMain) {
    option (google.api.http) = {
      get: "/usr/profile"
    };
  }

  rpc UpdateProfile(UsrUpdateProfileReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/usr/profile"
      body: "*"
    };
  }
}

message UsrMain {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp modified_at = 3;
  bool active = 4;
  bool is_admin = 5;
  string name = 6;
  string username = 7;
  // проекты, которые видит участник (если не all_projects); пусто — ни одного. Админу не ограничивает.
  repeated int64 project_ids = 8;
  // видит все проекты
  bool all_projects = 9;
  // привязан к внешнему провайдеру входа (ADR-019): логин, имя и флаг админа приходят от него
  bool external = 10;
}

// UsrProjectIdList — обёртка списка проектов: не передан — список не меняется
message UsrProjectIdList {
  repeated int64 values = 1;
}

// List

message UsrListReq {
  common.ListParamsSt list_params = 1;
  optional bool active = 2;
  repeated int64 ids = 3;
}

message UsrListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated UsrMain results = 2;
}

// Get (и Delete)

message UsrGetReq {
  int64 id = 1;
}

// Create

message UsrCreateReq {
  optional bool active = 1;
  optional bool is_admin = 2;
  optional string name = 3;
  optional string username = 4;
  optional string password = 5;
  repeated int64 project_ids = 6;
  optional bool all_projects = 7;
}

message UsrCreateRep {
  int64 id = 1;
}

// Update — пароль задаёт админ (например, временный)

message UsrUpdateReq {
  int64 id = 1;
  optional bool active = 2;
  optional bool is_admin = 3;
  optional string name = 4;
  optional string username = 5;
  optional string password = 6;
  UsrProjectIdList project_ids = 7;
  optional bool all_projects = 8;
}

// Вход

message UsrLoginReq {
  string username = 1;
  string password = 2;
}

message UsrLoginRep {
  string jwt = 1;
  string refresh_token = 2;
}

message UsrRefreshTokenReq {
  string refresh_token = 1;
}

message UsrBootstrapStatusRep {
  bool bootstrap_required = 1;
}

// Профиль — смена своего пароля требует текущий

message UsrUpdateProfileReq {
  optional string name = 1;
  optional string username = 2;
  optional string password = 3;
  optional string current_password = 4;
}
