syntax = "proto3";

package zorko_v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "/zorko_v1";

// SiteFetchService — история скачивания карт с сайта (последние 50 адресов проекта)
service SiteFetchService {
  rpc List(SiteFetchListReq) returns (SiteFetchListRep) {
    option (google.api.http) = {
      get: "/site_fetch"
    };
  }
}

message SiteFetchMain {
  string url = 1;
  // ok | error
  string state = 2;
  // код причины: site_http_404, site_no_sourcemap_url…
  string detail = 3;
  google.protobuf.Timestamp fetched_at = 4;
}

message SiteFetchListReq {
  int64 project_id = 1;
  // пусто — все; error — только неудачи
  string state = 2;
}

message SiteFetchListRep {
  repeated SiteFetchMain results = 1;
}
