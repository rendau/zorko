syntax = "proto3";

package zorko_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "/zorko_v1";

// ArtifactBundleService — залитые карты исходников (архивы из CI и скачанное с сайта)
service ArtifactBundleService {
  rpc List(ArtifactBundleListReq) returns (ArtifactBundleListRep) {
    option (google.api.http) = {
      get: "/artifact_bundle"
    };
  }

  rpc ListFiles(ArtifactBundleGetReq) returns (ArtifactBundleFileListRep) {
    option (google.api.http) = {
      get: "/artifact_bundle/{id}/file"
    };
  }

  // Delete — только админ; архив удаляется для всех проектов, к которым относится
  rpc Delete(ArtifactBundleGetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/artifact_bundle/{id}"
    };
  }
}

message ArtifactBundleMain {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  // upload — из CI, site — скачано с сайта
  string source = 3;
  // assembling | ok | error
  string state = 4;
  string detail = 5;
  string release = 6;
  string dist = 7;
  int32 file_count = 8;
  int64 size = 9;
  google.protobuf.Timestamp last_used_at = 10;
}

message ArtifactBundleListReq {
  common.ListParamsSt list_params = 1;
  int64 project_id = 2;
  // подстрока релиза, метка или отпечаток архива целиком
  string q = 3;
}

message ArtifactBundleListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated ArtifactBundleMain results = 2;
}

message ArtifactBundleGetReq {
  int64 id = 1;
}

message ArtifactBundleFile {
  string url = 1;
  // minified_source | source_map | source
  string type = 2;
  string debug_id = 3;
  string sourcemap = 4;
  int64 size = 5;
}

message ArtifactBundleFileListRep {
  repeated ArtifactBundleFile results = 1;
}
